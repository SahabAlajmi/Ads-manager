<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ads Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f0ea;--card:#fffaf6;--tx:#3b2f2e;--mut:#a39390;--ln:#eddcd3;--ac:#b8707a;--ac2:#e9c6b9;--soft:#f6e6df;--ok:#5d9b7a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181312;--card:#231b1a;--tx:#f5e9e4;--mut:#a89896;--ln:#34292a;--ac:#e0a1a3;--ac2:#6b4549;--soft:#33252a;--ok:#7cc29c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181312;--card:#231b1a;--tx:#f5e9e4;--mut:#a89896;--ln:#34292a;--ac:#e0a1a3;--ac2:#6b4549;--soft:#33252a;--ok:#7cc29c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Tajawal",-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px 16px 48px;max-width:560px;margin-inline:auto}
.hero{background:linear-gradient(160deg,var(--soft),var(--ac2));border-radius:32px;padding:22px 18px 18px;text-align:center;border:1px solid var(--ln)}
.av{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--card);box-shadow:0 8px 22px rgba(120,70,70,.25);background:var(--card)}
.pn{font-size:19px;font-weight:700;margin-top:8px}
.ph{font-size:12px;color:var(--ac);font-weight:500}
h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:28px;margin:10px 0 12px;color:var(--ac)}
.mn{direction:ltr;display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:22px;padding:6px}
.mn button{width:40px;height:40px;border:0;border-radius:50%;background:var(--soft);color:var(--ac);font-size:22px;cursor:pointer}
.mn b{display:block;font-size:18px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 10px;border-radius:10px;background:var(--soft);color:var(--ac);margin-top:2px}
.chip.closed{background:var(--ok);color:#fff}
.stats{display:flex;gap:8px;margin-top:12px}
.stats div{flex:1;background:var(--card);border-radius:18px;padding:10px 4px}
.stats b{display:flex;justify-content:center;align-items:baseline;gap:4px;font-size:15px;color:var(--ac)}
.stats b span{font-size:inherit;color:inherit}
.stats b i{font-style:normal;font-size:10px;font-weight:700;color:var(--mut)}
.stats .lb{display:block;font-size:11px;color:var(--mut)}
.nt{font-size:12px;color:var(--mut);margin:10px 0 0}
.add{display:block;width:100%;margin:16px 0 4px;font:inherit;font-weight:700;font-size:15px;color:#fff;background:var(--ac);border:0;border-radius:22px;padding:13px;cursor:pointer}
.ad{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:12px;margin-top:10px}
.ad input{font:inherit;font-size:14px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:9px 11px;width:100%;min-width:0}
.ad input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;height:42px;line-height:1.2;text-align:start}
.ad input[type=date]::-webkit-date-and-time-value{text-align:start;min-width:0}
.cal{margin-top:22px;background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:14px 10px}
.ct{font-weight:800;font-size:16px;text-align:center}
.lg{display:flex;justify-content:center;align-items:center;gap:4px;font-size:12px;color:var(--mut);margin:6px 0 10px}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline:8px 2px}
.dt.s{background:var(--ac2)}.dt.p{background:var(--ac)}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ch{text-align:center;font-size:10px;color:var(--mut);padding:2px 0}
.cd{min-height:64px;background:var(--bg);border-radius:12px;padding:4px 3px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cd.e{background:transparent}
.cd.has{background:var(--soft);box-shadow:0 0 0 1px var(--ac2) inset;cursor:pointer}
.cd.td{outline:2px solid var(--ac)}
.cd.sel{box-shadow:0 0 0 2px var(--ac) inset}
.dn{font-size:11px;font-weight:700;color:var(--mut)}
.cd.has .dn{color:var(--ac)}
.cc{font-size:9px;line-height:1.3;border-radius:6px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc.s{background:var(--ac2);color:var(--tx)}
.cc.p{background:var(--ac);color:var(--card)}
.cm{font-size:9px;color:var(--mut)}
.cdt{margin-top:10px;background:var(--bg);border-radius:14px;padding:10px 12px;font-size:13px}
.cdt div{margin-top:6px}
.sl{font-size:11px;color:var(--mut);margin-top:12px}
.sl+.st{margin-top:4px}
.ad select{font:inherit;font-size:14px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:9px 11px;width:100%;min-width:0;height:42px;margin-top:3px;-webkit-appearance:none;appearance:none}
.ad select:focus{outline:2px solid var(--ac2)}
.ad input:focus{outline:2px solid var(--ac2)}
.ad .nm{font-weight:700;font-size:15px;margin-bottom:8px}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hd .nm{margin-bottom:0;flex:1}
.gr{cursor:grab;touch-action:none;color:var(--mut);width:36px;height:36px;display:grid;place-items:center;flex:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:12px;background:var(--bg)}
.gr:active{cursor:grabbing}
.ad.drag{position:relative;z-index:6;box-shadow:0 18px 40px rgba(120,70,70,.3);border-color:var(--ac);will-change:transform}
body.dragging{user-select:none;-webkit-user-select:none}
.g2{display:flex;gap:8px;margin-top:8px}
.g2 label{flex:1;min-width:0;font-size:11px;color:var(--mut);display:block}
.g2 label input{margin-top:3px}
.st{display:flex;gap:6px;margin-top:12px}
.st label{flex:1;text-align:center;font-size:13px;border-radius:20px;padding:9px 0;cursor:pointer;user-select:none;color:var(--mut);background:var(--bg);transition:.2s}
.ad .st input{display:none}
.st label:has(input:checked){background:var(--ac);color:#fff;font-weight:700}
.st label:has(input:disabled){pointer-events:none}
.fo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--ln);font-size:13px;color:var(--mut)}
.fo b{color:var(--ac)}
.fo{flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;border-radius:10px;padding:2px 10px;background:var(--soft);color:var(--ac)}
.pill.pub{background:var(--ok);color:#fff}
.dl{border:0;background:none;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px}
.dl[data-arm]{color:#d0455a;font-weight:700}
.empty{text-align:center;color:var(--mut);font-size:13px;margin:28px 0}
.dw{position:relative;display:block}
.dw input[type=date]{padding-inline-end:34px}
.cx{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;background:var(--soft);color:var(--ac);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
#lg{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#lg.on{display:flex}
#lf{visibility:hidden;width:100%;max-width:360px;background:var(--card);border:1px solid var(--ln);border-radius:28px;padding:24px 20px;text-align:center}
#lg.rdy #lf{visibility:visible}
#lf input{display:block;width:100%;margin-top:10px;font:inherit;font-size:15px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:12px}
#lf input:focus{outline:2px solid var(--ac2)}
#le{color:#d0455a;font-size:12px;min-height:18px;margin-top:8px}
#lb{width:100%;font:inherit;font-weight:700;font-size:15px;color:#fff;background:var(--ac);border:0;border-radius:20px;padding:12px;cursor:pointer}
#lb:disabled{opacity:.6}
.so{font:inherit;font-size:12px;color:var(--ac);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0 4px}
.bn{text-align:center;color:var(--mut);font-size:12px;margin-top:22px}
</style>
</head>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const CFG={apiKey:"AIzaSyCX7gB-o48Kl-QxdnaR_liqxrDxAGBrJzc",authDomain:"ads-manager-c4c00.firebaseapp.com",projectId:"ads-manager-c4c00",storageBucket:"ads-manager-c4c00.firebasestorage.app",messagingSenderId:"197640778417",appId:"1:197640778417:web:46a165b0bee4ca15e46890"};
const TYPES=["منزلي","عيادات","تغطية"];
const RATE=.3,$=i=>document.getElementById(i);
let D=null,AS=0,SEL=null;
const GRIP='<div class="gr" role="button" aria-label="Drag"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg></div>';
let ADS={},SNAP=null,DEFER=false,DIRTY=false,RO=false,MODE="local",PEND={},TM={};
let cur=new Date();cur=new Date(cur.getFullYear(),cur.getMonth(),1);
const pad=n=>String(n).padStart(2,"0"),fmt=n=>(Math.round(n*100)/100).toLocaleString("en-US");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=()=>cur.getFullYear()+"-"+pad(cur.getMonth()+1);
const amo=a=>parseFloat(a.amount)||0;
const adM=a=>String(a.pub||a.shoot||a.m||"").slice(0,7);
const todayS=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
let store={set:async()=>{},upd:async()=>{},del:async()=>{}};
function note(t){$("bnt").textContent=t}
function fail(){note("Couldn’t save — you may have view-only access")}
function queue(id,f,v){DIRTY=true;PEND[id]=Object.assign(PEND[id]||{},{[f]:v});clearTimeout(TM[id]);TM[id]=setTimeout(()=>flush(id),600)}
function flush(id){const p=PEND[id];if(!p)return;delete PEND[id];clearTimeout(TM[id]);store.upd(id,p).catch(fail)}
function flushAll(){Object.keys(PEND).forEach(flush)}
const inList=()=>{const a=document.activeElement;return a&&a.closest&&a.closest("#list")&&a.matches("input,select")};
function totals(){
 const k=key(),L=Object.entries(ADS).filter(([i,a])=>adM(a)===k);
 const t=L.reduce((s,[i,a])=>s+amo(a),0);
 $("tt").textContent=fmt(t);$("tg").textContent=L.length;$("ta").textContent=fmt(t*RATE);
 document.querySelectorAll("[data-ag]").forEach(el=>{const a=ADS[el.dataset.ag];if(a)el.textContent=fmt(amo(a)*RATE)+" SAR"});
}
function card(id,a){
 const d=RO?" disabled":"",t=todayS();
 const st=a.p?["Posted","pub"]:a.pub?(a.pub<=t?["Published","pub"]:["Scheduled",""]):a.shoot?(a.shoot<=t?["Shot",""]:["To shoot",""]):["Draft",""];
 const f=(n,x)=>`data-id="${id}" data-f="${n}"${x||""}${d}`;
 const opts=['<option value="">النوع</option>'].concat([...TYPES,...(a.type&&!TYPES.includes(a.type)?[a.type]:[])].map(ty=>`<option${ty===a.type?" selected":""}>${esc(ty)}</option>`)).join("");
 return `<div class="ad" data-aid="${id}"><div class="hd"><input class="nm" ${f("name",' placeholder="Ad name" value="'+esc(a.name)+'"')}>${RO?"":GRIP}</div>
<div class="g2"><label>السعر (SAR)<input type="number" inputmode="decimal" min="0" step="any" ${f("amount",' value="'+(a.amount==null?"":esc(a.amount))+'"')}></label>
<label>النوع<select ${f("type")}>${opts}</select></label></div>
<div class="g2"><label>تاريخ التصوير<span class="dw"><input type="date" ${f("shoot",' value="'+esc(a.shoot)+'"')}>${RO||!a.shoot?"":`<button type="button" class="cx" data-clr="${id}|shoot" aria-label="Clear date">×</button>`}</span></label>
<label>تاريخ النشر<span class="dw"><input type="date" ${f("pub",' value="'+esc(a.pub)+'"')}>${RO||!a.pub?"":`<button type="button" class="cx" data-clr="${id}|pub" aria-label="Clear date">×</button>`}</span></label></div>
<div class="sl">الحالة</div>
<div class="st">${[["s","تصوير"],["e","مونتاج"],["p","نُشر"]].map(([n,l])=>`<label><input type="checkbox" ${f(n,a[n]?" checked":"")}>${l}</label>`).join("")}</div>
<div class="fo"><span>نسبة إدارة الأعمال ٣٠٪: <b data-ag="${id}"></b></span><span class="pill ${st[1]}">${st[0]}</span>${RO?"":`<button class="dl" type="button" data-del="${id}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Delete</span></button>`}</div></div>`;
}
function render(){
 const k=key(),now=new Date(),end=new Date(cur.getFullYear(),cur.getMonth()+1,0,23,59,59);
 $("mt").textContent=cur.toLocaleDateString("en-US",{month:"long",year:"numeric"});
 const closed=now>end,curM=now>=cur&&now<=end;
 $("nt").textContent=closed?"Month closed — final totals":curM?"Totals so far — final when the month ends":"Upcoming month";
 const L=Object.entries(ADS).filter(([i,a])=>adM(a)===k).sort((x,y)=>((typeof x[1].ord==="number"?x[1].ord:0)-(typeof y[1].ord==="number"?y[1].ord:0))||((x[1].pub||x[1].shoot||"9")+x[0]).localeCompare((y[1].pub||y[1].shoot||"9")+y[0]));
 $("list").innerHTML=L.length?L.map(([i,a])=>card(i,a)).join(""):'<div class="empty">No ads this month yet</div>';
 $("add").style.display=RO?"none":"block";renderCal();
 totals();
}
document.addEventListener("input",e=>{const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;const id=t.dataset.id;if(!ADS[id])return;
 let v=t.type==="checkbox"?t.checked:t.value;if(f==="amount")v=v===""?null:parseFloat(v);ADS[id][f]=v;queue(id,f,v);totals();renderCal()});
document.addEventListener("change",e=>{const t=e.target,f=t.dataset&&t.dataset.f;if(f==="shoot"||f==="pub"||f==="s"||f==="e"||f==="p"){flushAll();render()}});
document.addEventListener("focusout",()=>{setTimeout(()=>{if(inList())return;document.querySelectorAll("#list input[type=date]").forEach(el=>{const id=el.dataset.id,f=el.dataset.f;if(ADS[id]&&(ADS[id][f]||"")!==el.value){ADS[id][f]=el.value;queue(id,f,el.value)}});flushAll();if(DEFER&&!DIRTY&&SNAP)ADS=SNAP;DEFER=false;DIRTY=false;render()},60)});
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-del]");if(!b)return;
 if(b.dataset.arm){const id=b.dataset.del;delete ADS[id];store.del(id).catch(fail);render()}
 else{b.dataset.arm=1;b.querySelector("span").textContent="Tap again";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.querySelector("span").textContent="Delete"}},3000)}});
document.addEventListener("click",e=>{const c=e.target.closest&&e.target.closest("[data-clr]");if(!c)return;const [id,f]=c.dataset.clr.split("|");if(!ADS[id])return;ADS[id][f]="";queue(id,f,"");flushAll();render()});

function flip(el,from){const d=from-el.getBoundingClientRect().top;if(!d)return;el.style.transition="none";el.style.transform="translateY("+d+"px)";el.getBoundingClientRect();el.style.transition="transform .22s ease";el.style.transform="";setTimeout(()=>{el.style.transition=""},260)}
function dragUpdate(){if(!D)return;const c=D.card,L=c.parentNode;
 c.style.transform="translateY("+(D.y-D.sy)+"px) scale(1.02)";
 for(let i=0;i<4;i++){const r=c.getBoundingClientRect(),cy=r.top+r.height/2;let sib=null,up=false;
  const p=c.previousElementSibling,n=c.nextElementSibling;
  if(p&&p.classList.contains("ad")){const pr=p.getBoundingClientRect();if(cy<pr.top+pr.height/2){sib=p;up=true}}
  if(!sib&&n&&n.classList.contains("ad")){const nr=n.getBoundingClientRect();if(cy>nr.top+nr.height/2){sib=n}}
  if(!sib)break;
  const vt=r.top,st=sib.getBoundingClientRect().top;
  c.style.transform="";
  if(up)L.insertBefore(c,sib);else L.insertBefore(sib,c);
  const nt=c.getBoundingClientRect().top;
  D.sy=D.y-(vt-nt);
  c.style.transform="translateY("+(vt-nt)+"px) scale(1.02)";
  flip(sib,st)}}
function dragTick(){if(!D)return;if(AS){const b=scrollY;scrollBy(0,AS);D.sy-=scrollY-b;dragUpdate()}requestAnimationFrame(dragTick)}
document.addEventListener("pointerdown",e=>{const g=e.target.closest&&e.target.closest(".gr");if(!g||D)return;const card=g.closest(".ad");if(!card)return;e.preventDefault();
 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 flushAll();D={card,y:e.clientY,sy:e.clientY};card.classList.add("drag");document.body.classList.add("dragging");try{g.setPointerCapture(e.pointerId)}catch(x){}dragUpdate();dragTick()});
document.addEventListener("pointermove",e=>{if(!D)return;e.preventDefault();D.y=e.clientY;AS=e.clientY<110?-14:(e.clientY>innerHeight-110?14:0);dragUpdate()},{passive:false});
function endDrag(){if(!D)return;const c=D.card;D=null;AS=0;c.classList.remove("drag");c.style.transform="";document.body.classList.remove("dragging");
 [...document.querySelectorAll("#list .ad")].forEach((el,i)=>{const id=el.dataset.aid;if(ADS[id]&&ADS[id].ord!==i+1){ADS[id].ord=i+1;queue(id,"ord",i+1)}});
 flushAll();if(SNAP&&DEFER&&!Object.keys(PEND).length){}DEFER=false;render()}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);
function renderCal(){
 const y=cur.getFullYear(),m=cur.getMonth(),k=key(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),t=todayS(),ev={};
 Object.values(ADS).forEach(a=>{[["shoot","تصوير"],["pub","نشر"]].forEach(([f,l])=>{const d=a[f];if(d&&String(d).slice(0,7)===k){const n=+String(d).slice(8,10);(ev[n]=ev[n]||[]).push({n:a.name||"بدون اسم",f,l})}})});
 const H=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
 let h='<div class="ct">تقويم الشهر</div><div class="lg"><span class="dt s"></span>تصوير<span class="dt p"></span>نشر</div><div class="cg">'+H.map(x=>`<div class="ch">${x}</div>`).join("");
 for(let i=0;i<first;i++)h+='<div class="cd e"></div>';
 for(let d=1;d<=dim;d++){const e=ev[d]||[],ds=k+"-"+pad(d);
  h+=`<div class="cd${e.length?" has":""}${ds===t?" td":""}${SEL===d?" sel":""}" ${e.length?'data-day="'+d+'"':""}><span class="dn">${d}</span>`+e.slice(0,2).map(x=>`<span class="cc ${x.f==="pub"?"p":"s"}">${esc(x.n)}</span>`).join("")+(e.length>2?`<span class="cm">+${e.length-2}</span>`:"")+"</div>"}
 h+="</div>";
 if(SEL&&ev[SEL])h+=`<div class="cdt"><b>${SEL} ${$("mt").textContent}</b>`+ev[SEL].map(x=>`<div><span class="dt ${x.f==="pub"?"p":"s"}"></span>${x.l}: ${esc(x.n)}</div>`).join("")+"</div>";
 $("cal").innerHTML=h}
document.addEventListener("click",e=>{const c=e.target.closest&&e.target.closest("[data-day]");if(!c)return;const d=+c.dataset.day;SEL=SEL===d?null:d;renderCal()});
$("add").onclick=()=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 const a={name:"",amount:null,type:"",shoot:"",pub:"",m:key(),ord:Date.now()};ADS[id]=a;store.set(id,a).catch(fail);render();
 const el=document.querySelector('[data-id="'+id+'"][data-f="name"]');if(el)el.focus()};
$("pv").onclick=()=>{SEL=null;cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$("nx").onclick=()=>{SEL=null;cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
render();
const app=initializeApp(CFG),auth=getAuth(app),fs=getFirestore(app),col=collection(fs,"ads");
store={set:(i,d)=>setDoc(doc(col,i),d),upd:(i,d)=>updateDoc(doc(col,i),d),del:i=>deleteDoc(doc(col,i))};
let unsub=null;
onAuthStateChanged(auth,u=>{
 if(unsub){unsub();unsub=null}
 const lg=$("lg");
 if(!u){ADS={};SNAP=null;PEND={};DEFER=false;DIRTY=false;note("");render();lg.classList.add("on","rdy");return}
 lg.classList.remove("on");$("pw").value="";$("le").textContent="";
 note("● Live — "+u.email);
 unsub=onSnapshot(col,s=>{const n={};s.docs.forEach(d=>{n[d.id]=d.data()});SNAP=n;
  if(D||inList()||Object.keys(PEND).length){DEFER=true;return}ADS=n;render()},
  ()=>note("Couldn’t load data — check Firestore rules"));
});
$("lf").addEventListener("submit",async e=>{e.preventDefault();const b=$("lb");b.disabled=true;$("le").textContent="";
 try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
 catch(x){const c=x&&x.code||"";$("le").textContent=/invalid|wrong-password|user-not-found/.test(c)?"Wrong email or password":/too-many/.test(c)?"Too many tries — wait a bit":/network/.test(c)?"No connection":"Couldn’t sign in"}
 b.disabled=false});
$("so").onclick=()=>signOut(auth);
</script>
</body>
